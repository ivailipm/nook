# Local services for development. The app itself runs on Laravel Herd (http://nook.test).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nook
    ports:
      # 5434 on the host: other projects on this machine already use 5432 and 5433.
      - "5434:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
